spring.application.name=SmartHome


server.port=8088


jwt.secret-key=${JWT_SECRET_KEY:change-me-before-running}
jwt.expiration-time=86400000

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.show-sql=true

spring.jpa.hibernate.format-sql=true

spring.jpa.hibernate.ddl-auto=update

mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:smarthome-backend}
mqtt.topic=p_bigroom,bigroom

mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
logging.level.org.springframework.integration=INFO
logging.level.org.eclipse.paho.client.mqttv3=WARN


# 邮件服务器配置
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.socketFactory.port=465
spring.mail.properties.mail.smtp.ssl.socketFactory.class=javax.net.ssl.SSLSocketFactory

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# 验证码有效期（分钟）
verification.code.expiration=5



# ==========================
# MaxKB 配置（修正可用）
# ==========================
# base-url 只保留 MaxKB 根路径（包含 spaceId），不要再多拼 /chat
maxkb.base-url=${MAXKB_BASE_URL:http://localhost:8080/chat/api/replace-with-space-id}
maxkb.api-key=${MAXKB_API_KEY:}

# 解决Spring Boot 2.6+与Springfox的兼容性问题
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER


# 条件触发相关配置
conditional.trigger.api-url=http://localhost:8088/api/mqtt/send
conditional.trigger.default-topic=bigroom
conditional.trigger.default-command=liv_lit=0, kit_lit=0, tol_lit=0, fan_level=0
conditional.trigger.gas-leak-threshold=500
conditional.trigger.night-start-hour=22
conditional.trigger.night-end-hour=6

